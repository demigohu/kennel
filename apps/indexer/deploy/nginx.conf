# /etc/nginx/sites-available/api.kennelpad.fun
# 1) DNS: A record api.kennelpad.fun -> VPS IP
# 2) ln -s /etc/nginx/sites-available/api.kennelpad.fun /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# 3) certbot --nginx -d api.kennelpad.fun   (adds the 443 server block and the redirect)
server {
    listen 80;
    server_name api.kennelpad.fun;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
